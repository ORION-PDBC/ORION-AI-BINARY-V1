<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ORION AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #10233d 0%,
                    #071322 45%,
                    #040b14 100%
                );
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            width: min(1100px, 94%);
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #54d9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 6px;
            color: #9fb3ca;
            font-size: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #a7bdd3;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #27e6a5;
            box-shadow: 0 0 15px #27e6a5;
        }

        .panel {
            background: rgba(7, 20, 35, 0.88);
            border: 1px solid #173b5d;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #d8e5f2;
        }

        .input-area {
            display: flex;
            gap: 12px;
        }

        #asset {
            flex: 1;
            min-width: 0;
            height: 58px;
            padding: 0 20px;
            border-radius: 12px;
            border: 1px solid #22547c;
            background: #081827;
            color: white;
            font-size: 20px;
            outline: none;
        }

        #asset:focus {
            border-color: #27d9ff;
            box-shadow: 0 0 0 3px rgba(39,217,255,.1);
        }

        #analyzeButton {
            height: 58px;
            padding: 0 28px;
            border: none;
            border-radius: 12px;
            background: #1fc8f3;
            color: #03101a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #analyzeButton:hover {
            filter: brightness(1.08);
        }

        #analyzeButton:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #291820;
            border: 1px solid #6d3040;
            color: #ffb7c4;
        }

        .cards {
            margin-top: 25px;
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            min-height: 130px;
            padding: 20px;
            border-radius: 14px;
            background: #081a2c;
            border: 1px solid #173b5d;
        }

        .card-label {
            display: block;
            color: #8fa8bf;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .card strong {
            display: block;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .card small {
            color: #91a8bd;
            line-height: 1.4;
        }

        .market {
            margin-top: 25px;
            padding: 25px;
            border-radius: 14px;
            background: #061525;
            border: 1px solid #173b5d;
        }

        .market h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .market-placeholder {
            min-height: 160px;
            border: 1px dashed #28506e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718ba3;
            text-align: center;
            padding: 20px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #637c94;
            font-size: 13px;
        }

        @media (max-width: 800px) {

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 34px;
            }

            .cards {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .input-area {
                flex-direction: column;
            }

            #analyzeButton {
                width: 100%;
            }
        }

        @media (max-width: 500px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 18px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="brand">

            <div class="logo">
                O
            </div>

            <div>
                <h1>ORION AI</h1>

                <div class="subtitle">
                    Sistema de análise de mercado
                </div>
            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            <span>
                Sistema online
            </span>

        </div>

    </header>


    <main>

        <section class="panel">

            <label
                class="label"
                for="asset"
            >
                Ativo
            </label>

            <div class="input-area">

                <input
                    id="asset"
                    type="text"
                    placeholder="Ex.: PETR4, VALE3, ITUB4..."
                    autocomplete="off"
                >

                <button
                    id="analyzeButton"
                    type="button"
                >
                    ANALISAR ATIVO
                </button>

            </div>

            <div
                id="message"
                class="message"
            ></div>


            <section class="cards">

                <div class="card">

                    <span class="card-label">
                        Ativo
                    </span>

                    <strong id="assetName">
                        --
                    </strong>

                    <small>
                        Aguardando análise
                    </small>

                </div>


                <div class="card">

                    <span class="card-label">
                        Preço
                    </span>

                    <strong id="assetPrice">
                        R$ --
                    </strong>

                    <small>
                        Valor de referência
                    </small>

                </div>


                <div class="card">

                    <span class="card-label">
                        Variação
                    </span>

                    <strong id="assetVariation">
                        --%
                    </strong>

                    <small>
                        Última variação disponível
                    </small>

                </div>


                <div class="card">

                    <span class="card-label">
                        Sinal ORION
                    </span>

                    <strong id="orionSignal">
                        AGUARDANDO
                    </strong>

                    <small id="orionDescription">
                        Execute uma análise
                    </small>

                </div>

            </section>


            <section class="market">

                <h2>
                    MERCADO
                </h2>

                <div
                    id="marketArea"
                    class="market-placeholder"
                >
                    Informe um ativo e execute uma análise.
                </div>

            </section>

        </section>

    </main>


    <div class="footer">
        ORION AI — módulo inicial de análise
    </div>

</div>


<script>

    const assetInput =
        document.getElementById("asset");

    const analyzeButton =
        document.getElementById("analyzeButton");

    const message =
        document.getElementById("message");

    const assetName =
        document.getElementById("assetName");

    const assetPrice =
        document.getElementById("assetPrice");

    const assetVariation =
        document.getElementById("assetVariation");

    const orionSignal =
        document.getElementById("orionSignal");

    const orionDescription =
        document.getElementById("orionDescription");

    const marketArea =
        document.getElementById("marketArea");


    function mostrarErro(texto) {

        message.textContent = texto;
        message.style.display = "block";

    }


    function limparErro() {

        message.textContent = "";
        message.style.display = "none";

    }


    function formatarMoeda(valor) {

        return Number(valor).toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

    }


    function formatarVariacao(valor) {

        const numero = Number(valor);

        const sinal =
            numero > 0 ? "+" : "";

        return sinal + numero.toFixed(2) + "%";

    }


    async function analisarAtivo() {

        limparErro();

        const ativo =
            assetInput.value.trim().toUpperCase();

        if (!ativo) {

            mostrarErro(
                "Digite o código de um ativo."
            );

            assetInput.focus();

            return;
        }


        analyzeButton.disabled = true;

        analyzeButton.textContent =
            "ANALISANDO...";


        try {

            const resposta =
                await fetch(
                    "/api/analisar",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            ativo: ativo
                        })
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok || !dados.ok) {

                throw new Error(
                    dados.erro ||
                    "Não foi possível realizar a análise."
                );

            }


            assetName.textContent =
                dados.ativo;


            assetPrice.textContent =
                formatarMoeda(dados.preco);


            assetVariation.textContent =
                formatarVariacao(
                    dados.variacao
                );


            orionSignal.textContent =
                dados.sinal;


            orionDescription.textContent =
                dados.descricao;


            marketArea.innerHTML = `
                <div>
                    <strong>${dados.ativo}</strong><br><br>
                    Último preço: ${formatarMoeda(dados.preco)}<br>
                    Variação: ${formatarVariacao(dados.variacao)}<br>
                    Atualizado em: ${dados.timestamp}
                </div>
            `;

        }

        catch (erro) {

            console.error(erro);

            mostrarErro(
                erro.message ||
                "Erro ao realizar análise."
            );

        }

        finally {

            analyzeButton.disabled = false;

            analyzeButton.textContent =
                "ANALISAR ATIVO";

        }

    }


    analyzeButton.addEventListener(
        "click",
        analisarAtivo
    );


    assetInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                analisarAtivo();

            }

        }
    );

</script>

</body>
</html>
