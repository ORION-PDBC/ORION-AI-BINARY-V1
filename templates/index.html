<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORION AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #06111f;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            padding: 20px 0 35px;
            border-bottom: 1px solid #1b3854;
            margin-bottom: 30px;
        }

        .status {
            color: #55e6a5;
            font-size: 15px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 10px;
            color: #9db2c7;
            font-size: 17px;
        }

        section {
            margin-bottom: 30px;
        }

        .panel {
            background: #0b1b2d;
            border: 1px solid #193653;
            border-radius: 14px;
            padding: 25px;
        }

        .label {
            display: block;
            margin-bottom: 10px;
            color: #9db2c7;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #294967;
            background: #071522;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #55e6a5;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: 0;
            border-radius: 10px;
            background: #55e6a5;
            color: #06111f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            background: #071522;
            border: 1px solid #193653;
            min-height: 60px;
            color: #d9e7f2;
            white-space: pre-wrap;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: #0b1b2d;
            border: 1px solid #193653;
            border-radius: 12px;
            padding: 20px;
        }

        .card-label {
            display: block;
            color: #7892aa;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card strong {
            font-size: 20px;
        }

        .error {
            color: #ff7b7b;
        }

        .success {
            color: #55e6a5;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="status" id="status">● ORION AI — sistema pronto</div>

        <h1>ORION AI</h1>

        <div class="subtitle">
            Plataforma de análise de ativos
        </div>
    </header>


    <section>

        <div class="panel">

            <label class="label" for="asset">
                Ativo
            </label>

            <input
                id="asset"
                type="text"
                placeholder="Ex.: BTC, PETR4, VALE3..."
                autocomplete="off"
            >

            <button id="analyzeButton" type="button">
                ANALISAR ATIVO
            </button>

            <div class="result" id="result">
                Aguardando análise...
            </div>

        </div>

    </section>


    <section class="cards">

        <div class="card">
            <span class="card-label">Ativo</span>
            <strong id="assetName">—</strong>
        </div>

        <div class="card">
            <span class="card-label">Status</span>
            <strong id="analysisStatus">Aguardando</strong>
        </div>

        <div class="card">
            <span class="card-label">Conexão</span>
            <strong id="connectionStatus">Online</strong>
        </div>

    </section>

</div>


<script>
    const assetInput = document.getElementById("asset");
    const analyzeButton = document.getElementById("analyzeButton");

    const result = document.getElementById("result");
    const assetName = document.getElementById("assetName");
    const analysisStatus = document.getElementById("analysisStatus");
    const connectionStatus = document.getElementById("connectionStatus");
    const status = document.getElementById("status");


    async function analisarAtivo() {

        const ativo = assetInput.value.trim();

        if (!ativo) {
            result.textContent = "Digite um ativo antes de analisar.";
            result.className = "result error";
            analysisStatus.textContent = "Erro";
            return;
        }


        analyzeButton.disabled = true;

        result.className = "result";
        result.textContent = "Enviando ativo para o ORION AI...";

        assetName.textContent = ativo.toUpperCase();
        analysisStatus.textContent = "Analisando";
        connectionStatus.textContent = "Conectando";
        status.textContent = "● ORION AI — enviando análise";


        try {

            const response = await fetch("/analisar", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    ativo: ativo
                })
            });


            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.erro || "O servidor não conseguiu processar a análise."
                );

            }


            result.className = "result success";

            result.textContent =
                data.mensagem ||
                `Ativo ${data.ativo} recebido para análise.`;


            assetName.textContent = data.ativo || ativo.toUpperCase();

            analysisStatus.textContent = "Recebido";

            connectionStatus.textContent = "Online";

            status.textContent = "● ORION AI — análise recebida";


        } catch (error) {

            result.className = "result error";

            result.textContent =
                "Erro na comunicação com o servidor:\n\n" +
                error.message;

            analysisStatus.textContent = "Erro";

            connectionStatus.textContent = "Falha";

            status.textContent = "● ORION AI — erro de comunicação";

        } finally {

            analyzeButton.disabled = false;

        }
    }


    analyzeButton.addEventListener(
        "click",
        analisarAtivo
    );


    assetInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                analisarAtivo();
            }

        }
    );
</script>

</body>
</html>
